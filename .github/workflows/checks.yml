name: Checks
on:
  pull_request:
    branches:
      - main
jobs:
  typings:
    runs-on: ubuntu-latest
    name: typings
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Prebuild
        run: pnpm build
      - name: Check typings
        if: success()
        run: pnpm test:typings
  storybook:
    runs-on: ubuntu-latest
    name: storybook
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Check storybook
        run: pnpm build:storybook
